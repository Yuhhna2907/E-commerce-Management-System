spring.application.name=smartphone-management

# --- Spring Boot DevTools (profile local) ---
# Tắt cache Thymeleaf / static: sửa .html, .css nhanh thấy thay đổi sau restart tự động
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
# LiveReload (cài extension trình duyệt "LiveReload" hoặc dùng trình duyệt hỗ trợ) — tự refresh trang sau restart
spring.devtools.livereload.enabled=true
# Restart nhanh hơn khi file thay đổi liên tiếp
spring.devtools.restart.poll-interval=1s
spring.devtools.restart.quiet-period=400ms

# DATABASE
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/smart_phone
spring.datasource.username=root
spring.datasource.password=tittom343
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# LOG SQL
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

logging.level.org.springframework.web=DEBUG
spring.web.resources.add-mappings=false
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE