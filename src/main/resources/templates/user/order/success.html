<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đặt hàng thành công</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .success-box { max-width: 600px; margin: 80px auto; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        .check-icon { font-size: 80px; color: #28a745; margin-bottom: 20px; animation: scaleUp 0.5s ease-out; }
        .order-details { background: #fdfdfd; border: 1px dashed #ddd; border-radius: 8px; padding: 20px; text-align: left; margin: 30px 0; }
        .btn-home { background: #288ad6; color: white; border-radius: 25px; padding: 10px 30px; font-weight: 600; text-decoration: none; transition: 0.3s; }
        .btn-home:hover { background: #1b6ca8; color: white; }
        @keyframes scaleUp { from { transform: scale(0); } to { transform: scale(1); } }
    </style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container">
    <div class="success-box">
        <i class="bi bi-check-circle-fill check-icon"></i>
        <h2 class="fw-bold">ĐẶT HÀNG THÀNH CÔNG!</h2>
        <p class="text-muted">Cảm ơn <strong th:text="${order.customerName}"></strong> đã mua sắm. Đơn hàng của Duy đang được chuẩn bị.</p>

        <div class="order-details">
            <h6 class="fw-bold mb-3 border-bottom pb-2">Chi tiết đơn hàng</h6>
            <p class="mb-2"><strong>Mã đơn hàng:</strong> #<span th:text="${order.id}"></span></p>
            <p class="mb-2"><strong>Người nhận:</strong> <span th:text="${order.customerName}"></span></p>
            <p class="mb-2"><strong>Địa chỉ:</strong> <span th:text="${order.shippingAddress}"></span></p>
            <p class="mb-2"><strong>Tổng tiền:</strong> <span class="text-danger fw-bold" th:text="${#numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 0, 'POINT')} + '₫'"></span></p>
            <p class="mb-0"><strong>Trạng thái:</strong> <span class="badge bg-warning text-dark">Chờ xác nhận</span></p>
        </div>

        <div class="d-flex justify-content-center gap-3">
            <a th:href="@{/user/products}" class="btn-home">Tiếp tục mua sắm</a>
            <a th:href="@{/user/order/history}" class="btn btn-outline-secondary rounded-pill px-4">Lịch sử đơn hàng</a>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
