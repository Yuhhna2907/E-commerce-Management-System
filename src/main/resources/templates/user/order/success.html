<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đặt hàng thành công - HoangHa Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

<div class="max-w-2xl w-full bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-100">
    <div class="bg-[#00918e] p-8 text-center text-white">
        <div class="w-20 h-20 bg-white/20 rounded-full flex items-center justify-center mx-auto mb-4">
            <i class="fa-solid fa-check text-4xl"></i>
        </div>
        <h1 class="text-2xl font-bold uppercase tracking-wide">Đặt hàng thành công!</h1>
        <p class="opacity-80">Cảm ơn <span class="font-bold" th:text="${order.customerName}"></span> đã tin tưởng chúng tôi.</p>
    </div>

    <div class="p-8">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <div>
                <p class="text-gray-400 text-xs uppercase font-bold">Mã đơn hàng</p>
                <p class="font-mono text-lg" th:text="'#' + ${order.id}"></p>
            </div>
            <div class="text-right">
                <p class="text-gray-400 text-xs uppercase font-bold">Ngày đặt</p>
                <p th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}"></p>
            </div>
        </div>

        <div class="space-y-4 mb-8">
            <div th:each="item : ${order.items}" class="flex items-center gap-4">
                <img th:src="${item.imageUrl}" class="w-12 h-12 object-contain bg-gray-50 rounded-lg">
                <div class="flex-1">
                    <p class="text-sm font-bold text-gray-800" th:text="${item.productName}"></p>
                    <p class="text-xs text-gray-500" th:text="'Số lượng: ' + ${item.quantity}"></p>
                </div>
                <p class="font-bold text-sm" th:text="${#numbers.formatDecimal(item.subTotal, 0, 'POINT', 0, 'COMMA')} + ' ₫'"></p>
            </div>
        </div>

        <div class="bg-gray-50 rounded-2xl p-6 flex justify-between items-center mb-8">
            <span class="text-gray-600 font-bold uppercase text-sm">Tổng thanh toán:</span>
            <span class="text-2xl font-extrabold text-[#e11b1b]" th:text="${#numbers.formatDecimal(order.totalPrice, 0, 'POINT', 0, 'COMMA')} + ' ₫'"></span>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <a href="/" class="flex items-center justify-center gap-2 border-2 border-[#00918e] text-[#00918e] py-3 rounded-xl font-bold hover:bg-emerald-50 transition-all">
                <i class="fa-solid fa-house"></i> TRANG CHỦ
            </a>
            <a th:href="@{/user/order/history}" class="flex items-center justify-center gap-2 bg-[#00918e] text-white py-3 rounded-xl font-bold hover:bg-[#007a78] transition-all shadow-lg shadow-emerald-100">
                LỊCH SỬ ĐƠN <i class="fa-solid fa-arrow-right"></i>
            </a>
        </div>
    </div>
</div>

</body>
</html>
