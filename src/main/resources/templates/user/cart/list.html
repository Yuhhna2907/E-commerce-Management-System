<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Giỏ hàng</title>

    <style>
        body { font-family: Arial; background: #f5f5f5; padding: 20px; }
        .container { width: 900px; margin: auto; background: white; padding: 20px; border-radius: 10px; }
        h2 { text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        table th, table td { padding: 10px; text-align: center; border-bottom: 1px solid #ddd; }
        input[type="number"] { width: 60px; text-align: center; }

        .btn { padding: 6px 12px; border-radius: 5px; text-decoration: none; display: inline-block; }
        .btn-update { background: #2196F3; color: white; }
        .btn-delete { background: red; color: white; }
        .btn-clear { background: black; color: white; margin-top: 10px; }

        .total { text-align: right; margin-top: 20px; font-size: 18px; font-weight: bold; }
        .empty { text-align: center; margin-top: 40px; font-size: 18px; }
        .back { margin-top: 20px; }
    </style>
</head>

<body>

<div class="container">

    <h2>🛒 Giỏ hàng của bạn</h2>

    <!-- EMPTY -->
    <div th:if="${cart.items == null or #lists.isEmpty(cart.items)}" class="empty">
        Giỏ hàng đang trống 😢 <br><br>
        <a th:href="@{/}">⬅️ Quay lại mua hàng</a>
    </div>

    <!-- NOT EMPTY -->
    <div th:if="${cart.items != null and !#lists.isEmpty(cart.items)}">

        <table>
            <thead>
            <tr>
                <th>Sản phẩm</th>
                <th>Giá</th>
                <th>Số lượng</th>
                <th>Tổng</th>
                <th>Hành động</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="item : ${cart.items}">

                <!-- NAME -->
                <td th:text="${item.productName}"></td>

                <!-- PRICE -->
                <td th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>

                <!-- UPDATE -->
                <td>
                    <form th:action="@{/user/cart/update}" method="post">
                        <input type="hidden" name="productId" th:value="${item.productId}"/>
                        <input type="number" name="quantity"
                               th:value="${item.quantity}" min="1"/>

                        <button class="btn btn-update" type="submit">
                            Cập nhật
                        </button>
                    </form>
                </td>

                <!-- ITEM TOTAL -->
                <td th:text="${#numbers.formatDecimal(item.total, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>

                <!-- DELETE -->
                <td>
                    <a th:href="@{/user/cart/remove/{id}(id=${item.productId})}"
                       class="btn btn-delete">
                        Xoá
                    </a>
                </td>

            </tr>
            </tbody>
        </table>

        <!-- TOTAL -->
        <div class="total">
            Tổng tiền:
            <span th:text="${#numbers.formatDecimal(cart.totalPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
        </div>

        <!-- CLEAR -->
        <div style="text-align: right;">
            <form th:action="@{/user/cart/clear}" method="post">
                <button class="btn btn-clear">🗑 Xoá toàn bộ</button>
            </form>
        </div>

        <!-- BACK -->
        <div class="back">
            <a th:href="@{/}">⬅️ Tiếp tục mua hàng</a>
        </div>

    </div>

</div>

</body>
</html>
