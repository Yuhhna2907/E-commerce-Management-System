<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sản phẩm</title>

    <style>
        body { font-family: Arial; background: #f5f5f5; }
        .container { width: 900px; margin: auto; background: white; padding: 20px; }
        .product { border-bottom: 1px solid #ddd; padding: 10px; }
        .btn { padding: 5px 10px; background: green; color: white; border: none; }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-custom sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/user/products">
            <i class="bi bi-phone-vibrate text-warning"></i> <b>SMARTPHONE</b> STORE
        </a>

        <div class="d-flex align-items-center">
            <a href="/user/cart" class="btn btn-outline-light position-relative me-3 border-0">
                <i class="bi bi-cart3 fs-5"></i>
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill cart-badge"
                      th:if="${cart != null and cart.items != null}"
                      th:text="${#lists.size(cart.items)}">0</span>
            </a>

    <h2>📱 Danh sách sản phẩm</h2>

    <div th:each="p : ${products}" class="product">

        <p><b th:text="${p.name}"></b></p>

        <p>
            Giá:
            <span th:text="${#numbers.formatDecimal(p.price,0,'COMMA',0,'POINT')} + ' đ'"></span>
        </p>

        <!-- ✅ ADD TO CART -->
        <form th:action="@{/user/cart/add}" method="post">
            <input type="hidden" name="productId" th:value="${p.id}"/>
            <input type="number" name="quantity" value="1" min="1"/>

            <button class="btn">Thêm vào giỏ</button>
        </form>

    </div>

    <br>

    <a th:href="@{/user/cart}">🛒 Xem giỏ hàng</a>

</div>

</body>
</html>
