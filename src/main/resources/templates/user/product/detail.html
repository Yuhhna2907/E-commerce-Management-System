<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${product.name}">Chi tiết sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .product-detail-shell {
            max-width: 1200px;
        }

        .detail-panel {
            border-radius: 24px;
            overflow: hidden;
        }

        .detail-image-wrap {
            min-height: 420px;
            background: linear-gradient(180deg, #ffffff 0%, #f8f9fa 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .detail-image-wrap img {
            max-height: 380px;
            object-fit: contain;
        }

        .detail-info-wrap {
            background: #fff;
            border-left: 1px solid #f1f1f1;
            padding: 28px;
            min-height: 420px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .detail-price {
            font-size: 2rem;
            line-height: 1.1;
        }

        .detail-meta {
            font-size: 0.95rem;
        }

        .detail-description-box {
            border-radius: 18px;
            background: #fff;
        }

        .review-card {
            border-radius: 18px;
        }
    </style>
</head>
<body class="bg-light">

<div th:replace="fragments/header :: header"></div>

<div class="container py-4 product-detail-shell">
    <div class="row g-0 bg-white shadow-sm detail-panel">
        <!-- Product image -->
        <div class="col-12 col-lg-5">
            <div class="detail-image-wrap">
                <img th:src="${product.imageUrl != null ? product.imageUrl : 'https://via.placeholder.com/400'}"
                     class="img-fluid rounded-3"
                     th:alt="${product.name}">
            </div>
        </div>

        <!-- Product info -->
        <div class="col-12 col-lg-7">
            <div class="detail-info-wrap">
                <div class="text-muted small mb-2 detail-meta">
                    <span th:text="'Hãng: ' + ${product.brand}">Hãng</span>
                    <span class="mx-2">|</span>
                    <span th:text="'Mã SP: ' + ${product.id}">Mã SP</span>
                </div>

                <h2 class="fw-bold mb-3" th:text="${product.name}">Tên sản phẩm</h2>

                <div class="mb-3">
                    <span class="detail-price fw-bold text-danger"
                          th:text="${#numbers.formatDecimal(product.discountPrice, 0, 'POINT', 0, 'COMMA')} + ' ₫'">
                        0 ₫
                    </span>
                    <span class="text-muted text-decoration-line-through ms-2"
                          th:text="${#numbers.formatDecimal(product.price, 0, 'POINT', 0, 'COMMA')} + ' ₫'">
                        0 ₫
                    </span>
                    <span class="badge bg-danger ms-2" th:text="${product.discountLabel}">-15%</span>
                </div>

                <div class="mb-3 d-flex flex-wrap gap-2">
                    <span class="badge bg-primary" th:if="${product.color != null}" th:text="${product.color}"></span>
                    <span class="badge bg-secondary" th:if="${product.categoryName != null}" th:text="${product.categoryName}"></span>
                    <span class="badge bg-success" th:text="'Còn ' + ${product.stock} + ' sản phẩm'"></span>
                </div>

                <div class="mt-auto pt-2">
                    <a th:href="@{/user/products}" class="btn btn-outline-secondary px-4">
                        Quay lại
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Description -->
    <div class="bg-white rounded-4 shadow-sm p-4 mt-4 detail-description-box">
        <h4 class="fw-bold mb-3">Mô tả sản phẩm</h4>
        <p class="text-muted mb-0" th:text="${product.description}">
            Mô tả sản phẩm...
        </p>
    </div>

    <!-- Reviews -->
    <div class="bg-white rounded-4 shadow-sm p-4 mt-4 review-card">
        <h3 class="fw-bold mb-4">Đánh giá sản phẩm</h3>

        <div class="row g-4 align-items-start mb-4">
            <div class="col-12 col-md-4 text-center text-md-start">
                <div class="display-1 fw-bold lh-1" th:text="${product.averageRating != null ? product.averageRating : 0}">0</div>
                <div class="text-muted">
                    <span th:text="${product.totalReviews != null ? product.totalReviews : 0}">0</span> đánh giá
                </div>
            </div>

            <div class="col-12 col-md-8">
                <div class="d-flex align-items-center mb-2" th:each="star : ${#numbers.sequence(5,1,-1)}">
                    <div style="width: 24px;" class="text-muted fw-semibold" th:text="${star}">5</div>
                    <i class="bi bi-star-fill text-warning me-2"></i>
                    <div class="progress flex-grow-1" style="height: 12px;">
                        <div class="progress-bar bg-light" style="width: 0%;"></div>
                    </div>
                </div>
            </div>
        </div>

        <hr>

        <h5 class="fw-bold mb-3">Đánh giá của khách hàng</h5>

        <div th:if="${#lists.isEmpty(reviews)}" class="text-muted">
            Chưa có đánh giá nào cho sản phẩm này.
        </div>

        <div class="vstack gap-3" th:if="${!#lists.isEmpty(reviews)}">
            <div class="border rounded-3 p-3" th:each="review : ${reviews}">
                <div class="d-flex justify-content-between mb-1">
                    <div class="fw-semibold" th:text="${review.username}">User</div>
                    <div class="text-muted small" th:text="${review.createdAt}">time</div>
                </div>
                <div class="text-warning mb-2" th:text="${'★'.repeat(review.rating)}">★★★★★</div>
                <div th:text="${review.comment}">Comment</div>
            </div>
        </div>
    </div>
</div>

<div th:replace="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
</html>
