<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Showroom Yêu Thích | SmartZone 2026</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Icon mỏng line-art -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --bg-showroom: #F1F3F5; 
            --bento-bg: rgba(255, 255, 255, 0.65);
            --bento-border: rgba(255, 255, 255, 0.95);
            --radius-showroom: 24px;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-orange: #f59e0b;
            --accent-orange-glow: rgba(245, 158, 11, 0.4);
            /* Soft glow hover shadow */
            --shadow-bento: 0 10px 30px -10px rgba(0,0,0,0.04), inset 0 1px 0 rgba(255,255,255,1);
            --shadow-bento-hover: 0 20px 40px -15px rgba(245, 158, 11, 0.15), 0 0 40px rgba(245, 158, 11, 0.08), inset 0 1px 0 rgba(255,255,255,1);
        }

        body {
            background-color: var(--bg-showroom);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(245, 158, 11, 0.03) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(13, 110, 253, 0.02) 0%, transparent 40%);
            font-family: 'Outfit', sans-serif;
            color: var(--text-main);
            letter-spacing: -0.01em;
            overflow-x: hidden;
        }

        .page-header {
            margin-top: 40px;
            margin-bottom: 30px;
            text-align: center;
        }

        .page-title {
            font-weight: 800;
            font-size: 2.5rem;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, #0f172a, #475569);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        /* --- Toolbar (Minimalist Bento Row) --- */
        .smart-toolbar {
            background: var(--bento-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: var(--radius-showroom);
            padding: 12px 20px;
            border: 1px solid var(--bento-border);
            box-shadow: 0 8px 20px -10px rgba(0,0,0,0.03);
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .search-wishlist-wrap {
            position: relative;
            flex-grow: 1;
            max-width: 250px;
        }

        .search-wishlist {
            background: transparent;
            border: none;
            padding: 8px 16px 8px 36px;
            width: 100%;
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-main);
            transition: all 0.3s;
        }

        .search-wishlist:focus { outline: none; }
        .search-icon {
            position: absolute;
            left: 10px; top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1rem;
        }

        .filter-select {
            background: transparent;
            border: none;
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-muted);
            cursor: pointer;
            outline: none;
        }

        .btn-compare {
            background: rgba(15, 23, 42, 0.05);
            color: var(--text-main);
            border-radius: 50px;
            padding: 8px 20px;
            font-weight: 700;
            font-size: 0.85rem;
            border: none;
            transition: all 0.3s;
        }
        .btn-compare:hover:not(:disabled) {
            background: var(--text-main);
            color: #fff;
            box-shadow: 0 5px 15px rgba(15, 23, 42, 0.2);
        }

        /* --- Showroom Bento Grid --- */
        .bento-grid {
            display: grid;
            /* Cố định min/max để ngăn bị kéo giãn khổng lồ khi chỉ có 1-2 SP */
            grid-template-columns: repeat(auto-fill, minmax(240px, 280px));
            justify-content: start;
            gap: 24px;
        }

        .bento-card {
            background: var(--bento-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--bento-border);
            border-radius: var(--radius-showroom);
            padding: 24px;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            transform-origin: center;
            box-shadow: var(--shadow-bento);
            height: 100%;
            aspect-ratio: 4/5; /* Tỉ lệ khung tranh gọn gàng */
        }

        .bento-card:hover {
            transform: translateY(-8px); /* Lift-up */
            box-shadow: var(--shadow-bento-hover); /* Soft Glow */
            background: rgba(255,255,255,0.9);
        }

        .bento-card.fade-out {
            opacity: 0;
            transform: scale(0.9) translateY(20px);
            pointer-events: none;
        }

        /* Nút Xóa (Trash Line-art) Ẩn hiện trên hover */
        .btn-remove {
            position: absolute;
            top: 16px; right: 16px;
            width: 32px; height: 32px;
            border-radius: 50%;
            background: rgba(255,255,255,0.8);
            border: 1px solid rgba(15, 23, 42, 0.05);
            color: var(--text-muted);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            z-index: 20;
            transition: all 0.4s ease;
            font-size: 1rem;
            opacity: 0; /* Mờ đi */
            transform: scale(0.8);
        }
        .bento-card:hover .btn-remove {
            opacity: 1;
            transform: scale(1);
        }
        .btn-remove:hover {
            color: #ef4444; background: #fff; border-color: #fca5a5;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
        }

        /* Checkbox So sánh */
        .compare-checkbox {
            position: absolute;
            top: 16px;
            left: 16px;
            width: 20px;
            height: 20px;
            cursor: pointer;
            z-index: 20;
            accent-color: #f59e0b;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .bento-card:hover .compare-checkbox {
            opacity: 1;
        }

        /* Hình ảnh 3D Parallax mượt */
        .product-img-box {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 140px; /* Thu nhỏ để cân bằng */
            margin-bottom: 20px;
            perspective: 1000px;
            position: relative;
        }

        .product-img {
            max-height: 100%; max-width: 100%;
            object-fit: contain;
            filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.1));
            transition: transform 0.5s ease, filter 0.5s;
            transform-style: preserve-3d;
        }
        
        .bento-card:hover .product-img {
            transform: scale(1.08) rotateX(5deg) rotateY(-5deg);
            filter: drop-shadow(-8px 25px 30px rgba(0, 0, 0, 0.15));
        }

        /* Typography */
        .product-name {
            font-weight: 600; /* Semi-bold */
            font-size: 1rem;
            color: var(--text-main);
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-line-break: anywhere;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-decoration: none;
            line-height: 1.3;
        }

        .product-price {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800; /* Đậm hơn */
            font-size: 1.4rem; /* Nổi bật */
            color: #ef4444; /* Đỏ mượt */
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }
        
        .price-strike {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: #94a3b8;
            text-decoration: line-through;
            font-weight: 500;
            margin-left: 6px;
        }

        /* Thông số cô đọng (Mô phỏng) - Nhỏ và nền mờ */
        .product-specs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 16px;
        }
        
        .spec-pill {
            background: rgba(15, 23, 42, 0.03);
            border: 1px solid rgba(15, 23, 42, 0.06);
            border-radius: 50px;
            padding: 3px 8px;
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.2px;
        }

        /* Action Row: Price & Cart Button */
        .action-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
        }

        /* Thêm nhanh vào giỏ - Capsule Gradient Glow */
        .btn-quick-add {
            background: linear-gradient(135deg, #f97316 0%, #f59e0b 100%);
            border: none;
            border-radius: 50px; /* Capsule */
            width: 38px; height: 38px; /* Biến thành icon tròn hoặc bầu dục */
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; color: #fff;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
            cursor: pointer;
        }
        .btn-quick-add:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.6);
            background: linear-gradient(135deg, #ea580c 0%, #d97706 100%);
        }

        /* --- Empty State --- */
        .empty-dashboard {
            background: var(--bento-bg);
            backdrop-filter: blur(24px);
            border: 1px solid var(--bento-border);
            border-radius: var(--radius-showroom);
            padding: 100px 20px;
            text-align: center;
            box-shadow: var(--shadow-bento);
        }

        .empty-illustration {
            width: 140px;
            margin-bottom: 24px;
            animation: float 4s ease-in-out infinite;
            filter: drop-shadow(0 15px 25px rgba(245, 158, 11, 0.2));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container py-4">
    
    <div class="page-header">
        <h2 class="page-title">Interactive Showroom</h2>
        <p class="text-muted fw-medium fs-6">Đẳng cấp sống được thể hiện qua từng sự lựa chọn.</p>
    </div>

    <!-- Empty State Đặc Quyền -->
    <div th:if="${#lists.isEmpty(wishlistItems)}" class="empty-dashboard mx-auto" style="max-width: 700px;">
        <i class="bi bi-box2-heart text-warning empty-illustration d-inline-block" style="font-size: 6rem; line-height: 1;"></i>
        <h3 class="fw-bold mb-3 mt-3" style="font-size: 1.8rem; letter-spacing: -0.02em;">Showroom của bạn đang đợi những siêu phẩm đầu tiên...</h3>
        <p class="text-muted mb-4 fs-6">Dấu ấn công nghệ của riêng bạn sẽ được phô diễn tại đây.</p>
        <a th:href="@{/user/products}" class="btn btn-dark rounded-pill px-5 py-3 fw-bold fs-6" style="box-shadow: 0 8px 20px rgba(0,0,0,0.15);">Khám phá ngay</a>
    </div>

    <!-- Khi có sản phẩm -->
    <div th:if="${not #lists.isEmpty(wishlistItems)}">
        <!-- Minimalist Toolbar -->
        <div class="smart-toolbar" id="showroomDb">
            <div class="d-flex align-items-center gap-2 border-end pe-3" style="border-color: rgba(0,0,0,0.05)!important;">
                <button class="btn-compare" id="btnCompare" disabled onclick="goToCompare()">
                    <i class="bi bi-intersect"></i> So sánh (<span id="compareCount">0</span>)
                </button>
            </div>

            <div class="search-wishlist-wrap">
                <i class="bi bi-search search-icon"></i>
                <input type="text" id="searchInput" class="search-wishlist" placeholder="Tìm kiếm nhanh...">
            </div>
            
            <div class="d-flex align-items-center gap-2">
                <i class="bi bi-sort-down text-muted"></i>
                <select id="sortSelect" class="filter-select">
                    <option value="new">Mới nhất</option>
                    <option value="price-asc">Giá tăng dần</option>
                    <option value="price-desc">Giá giảm dần</option>
                </select>
            </div>
        </div>

        <!-- Bento Grid Showroom -->
        <div class="bento-grid" id="wishlistGrid">
            
            <div th:each="product : ${wishlistItems}" class="bento-wrapper" th:data-name="${#strings.toLowerCase(product.name)}" th:data-price="${product.discountPrice != null ? product.discountPrice : product.price}" th:data-product-id="${product.id}" th:id="'wishlist-item-' + ${product.id}">
                <div class="bento-card">
                    
                    <!-- Checkbox So sánh -->
                    <input type="checkbox" class="compare-checkbox" th:data-product-id="${product.id}" onchange="updateCompareButton()" style="position: absolute; top: 16px; left: 16px; width: 20px; height: 20px; cursor: pointer; z-index: 20;">
                    
                    <!-- Nút Xóa siêu mờ -->
                    <button class="btn-remove" th:onclick="|removeWishlistItem(event, ${product.id})|" title="Xóa">
                        <i class="bi bi-x"></i>
                    </button>

                    <!-- Hình ảnh dạng khung tranh -->
                    <a th:href="@{/user/products/{id}(id=${product.id})}">
                        <div class="product-img-box">
                            <img th:src="${product.imageUrl != null ? product.imageUrl : 'https://via.placeholder.com/400'}" class="product-img" alt="Product Image">
                        </div>
                    </a>

                    <!-- Nội dung -->
                    <div class="mt-auto">
                        <!-- Thông số cô đọng dạng micro-pill -->
                        <div class="product-specs">
                            <span class="spec-pill"><i class="bi bi-cpu"></i> Chip Pro</span>
                            <span class="spec-pill"><i class="bi bi-display"></i> 120Hz</span>
                        </div>
                        
                        <a th:href="@{/user/products/{id}(id=${product.id})}" class="product-name" th:text="${product.name}">Tên Sản Phẩm</a>
                        
                        <div class="action-row mt-2">
                            <a th:href="@{/user/products/{id}(id=${product.id})}" class="text-decoration-none">
                                <div class="product-price" th:if="${product.discountPrice != null and product.discountPrice < product.price}">
                                    <span th:text="${#numbers.formatDecimal(product.discountPrice, 0, 'COMMA', 0, 'POINT')} + '₫'"></span>
                                    <span class="price-strike" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')}"></span>
                                </div>
                                <div class="product-price" th:unless="${product.discountPrice != null and product.discountPrice < product.price}">
                                    <span th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + '₫'"></span>
                                </div>
                            </a>
                            
                            <!-- Nút Xem chi tiết -->
                            <a th:href="@{/user/products/{id}(id=${product.id})}" class="btn-quick-add text-decoration-none" title="Xem chi tiết thiết bị">
                                <i class="bi bi-arrow-right"></i>
                            </a>
                        </div>
                    </div>
                    
                </div>
            </div>

        </div>
    </div>

</div>

<!-- Toast Container -->
<div class="toast-container position-fixed bottom-0 end-0 p-4" style="z-index: 1080;">
    <div id="wishlistToastAction" class="toast align-items-center bg-white border-0 shadow-lg rounded-4" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex p-1">
            <div class="toast-body fw-bold text-dark d-flex align-items-center gap-2 fs-6" id="wishlistToastActionMsg">
                Cập nhật thành công!
            </div>
            <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}" class="mt-5"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        
        // --- TÌM KIẾM THEO TÊN BẰNG JS (Real-time Filtering) ---
        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.addEventListener('keyup', function(e) {
                const keyword = e.target.value.toLowerCase();
                const items = document.querySelectorAll('.bento-wrapper');
                items.forEach(item => {
                    const name = item.getAttribute('data-name');
                    if(name.indexOf(keyword) > -1) {
                        item.style.display = 'flex';
                    } else {
                        item.style.display = 'none';
                    }
                });
            });
        }

        // --- SẮP XẾP BẰNG JS MƯỢT MÀ ---
        const sortSelect = document.getElementById('sortSelect');
        const grid = document.getElementById('wishlistGrid');
        if (sortSelect && grid) {
            sortSelect.addEventListener('change', function() {
                const val = this.value;
                const itemsArray = Array.from(grid.querySelectorAll('.bento-wrapper'));
                
                if(val === 'price-asc') {
                    itemsArray.sort((a,b) => parseFloat(a.getAttribute('data-price')) - parseFloat(b.getAttribute('data-price')));
                } else if(val === 'price-desc') {
                    itemsArray.sort((a,b) => parseFloat(b.getAttribute('data-price')) - parseFloat(a.getAttribute('data-price')));
                } else {
                    // Default / Mới nhất (Tạm thời không revert DOM nếu không có index, mockup JS)
                    itemsArray.sort((a,b) => parseFloat(a.getAttribute('data-price')) - parseFloat(b.getAttribute('data-price'))); 
                }

                // Render lại thứ tự
                itemsArray.forEach(item => grid.appendChild(item));
            });
        }

    });

    // --- CẬP NHẬT NÚT SO SÁNH ---
    function updateCompareButton() {
        const checkboxes = document.querySelectorAll('.compare-checkbox:checked');
        const count = checkboxes.length;
        document.getElementById('compareCount').textContent = count;
        
        const btnCompare = document.getElementById('btnCompare');
        if (count >= 2 && count <= 4) {
            btnCompare.disabled = false;
        } else {
            btnCompare.disabled = true;
        }
    }

    // --- ĐI ĐẾN TRANG SO SÁNH ---
    function goToCompare() {
        const checkboxes = document.querySelectorAll('.compare-checkbox:checked');
        const ids = Array.from(checkboxes).map(cb => cb.getAttribute('data-product-id'));
        
        if (ids.length >= 2 && ids.length <= 4) {
            window.location.href = '/user/compare?ids=' + ids.join(',');
        } else {
            alert('Vui lòng chọn từ 2-4 sản phẩm để so sánh');
        }
    }

    // --- XÓA WISHLIST ---
    function removeWishlistItem(event, productId) {
        event.preventDefault();
        const cardItem = document.getElementById('wishlist-item-' + productId);
        
        fetch('/api/user/wishlist/remove', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ productId: productId })
        })
        .then(res => res.json())
        .then(data => {
            cardItem.querySelector('.bento-card').classList.add('fade-out');
            setTimeout(() => {
                cardItem.remove();
                checkEmptyState();
            }, 500); 
            showActionToast("<i class='bi bi-trash text-muted fs-4'></i> Tạm biệt kiệt tác này.");
        })
        .catch(err => {
            cardItem.querySelector('.bento-card').classList.add('fade-out');
            setTimeout(() => { cardItem.remove(); checkEmptyState(); }, 500);
            showActionToast("<i class='bi bi-trash text-muted fs-4'></i> Gọi API thất bại, thử nghiệm local.");
        });
    }

    // --- THÊM GIỎ HÀNG ---
    function quickAddCart(productId) {
        fetch('/user/cart/add', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ productId: productId, quantity: 1 })
        })
        .then(res => res.json())
        .then(data => {
             showActionToast("<i class='bi bi-bag-check-fill text-warning fs-4'></i> Đã nhảy vào Giỏ hàng!");
        })
        .catch(err => {
             showActionToast("<i class='bi bi-check-circle text-warning fs-4'></i> Thực thi thành công (local)");
        });
    }

    // --- Utils ---
    function showActionToast(msgHtml) {
        const toastEl = document.getElementById('wishlistToastAction');
        document.getElementById('wishlistToastActionMsg').innerHTML = msgHtml;
        const toast = new bootstrap.Toast(toastEl, {delay: 3000});
        toast.show();
    }

    function checkEmptyState() {
        const grid = document.getElementById('wishlistGrid');
        if(grid && grid.children.length === 0) {
            window.location.reload(); 
        }
    }
</script>
</body>
</html>
