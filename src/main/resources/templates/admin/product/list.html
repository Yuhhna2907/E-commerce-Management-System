<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý sản phẩm</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        .header-red { background-color: #d70018; }
        .sidebar { min-height: 100vh; border-right: 1px solid #dee2e6; }
        .sidebar a { text-decoration: none; display: block; padding: 10px; color: #333; border-radius: 5px; }
        .sidebar a:hover { background-color: #f8f9fa; color: #d70018; }
        .footer { background: #212529; color: white; }
    </style>
</head>
<body>

<!-- HEADER -->
<nav class="navbar navbar-expand-lg header-red navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">SMARTPHONE STORE</a>
        <div class="text-white">Xin chào Admin</div>
    </div>
</nav>

<!-- BODY -->
<div class="container-fluid">
    <div class="row">

        <!-- SIDEBAR -->
        <div class="col-md-2 bg-white sidebar p-3">
            <h5>Danh mục</h5>
            <a href="#">📱 Điện thoại</a>
            <a href="#">💻 Laptop</a>
        </div>

        <!-- CONTENT -->
        <div class="col-md-10 p-4">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3>Danh sách sản phẩm</h3>
                <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#createProductModal">
                    + Thêm sản phẩm
                </button>
            </div>

            <!-- SEARCH + FILTER -->
            <form class="d-flex mb-3" method="get" th:action="@{/admin/products}">
                <input class="form-control me-2" type="search" name="keyword" placeholder="Tìm kiếm sản phẩm...">
                <select class="form-select me-2" name="categoryId" style="width:200px;">
                    <option value="">-- Chọn danh mục --</option>
                    <option value="1">Điện thoại</option>
                    <option value="2">Laptop</option>
                </select>
                <button class="btn btn-outline-secondary" type="submit"><i class="bi bi-search"></i></button>
            </form>

            <!-- TABLE -->
            <table class="table table-bordered table-hover align-middle">
                <thead class="table-light">
                <tr class="text-center">
                    <th>ID</th>
                    <th>Tên</th>
                    <th class="text-center">Giá</th>
                    <th class="text-center">Tồn kho</th>
                    <th>Danh mục</th>
                    <th>Trạng thái</th>
                    <th width="150">Thao tác</th>
                </tr>
                </thead>
                <tbody id="productTableBody">
                <tr th:each="product : ${products}">
                    <td th:text="${product.id}" class="text-center"></td>
                    <td th:text="${product.name}"></td>
                    <td th:text="${product.price}"></td>
                    <td th:text="${product.stock}" class="text-center"></td>
                    <td th:text="${product.categoryName}"></td>
                    <td class="text-center">
                        <span class="badge bg-success" th:if="${product.active}">Hoạt động</span>
                        <span class="badge bg-secondary" th:unless="${product.active}">Đã ẩn</span>
                    </td>
                    <td class="text-center">
                        <button type="button" class="btn btn-warning btn-sm edit-btn"
                                th:attr="data-id=${product.id},
                                         data-name=${product.name},
                                         data-price=${product.price},
                                         data-brand=${product.brand},
                                         data-stock=${product.stock},
                                         data-image-url=${product.imageUrl},
                                         data-description=${product.description},
                                         data-category-id=${product.categoryId}">
                            Sửa
                        </button>
                        <a th:href="@{'/admin/products/delete/' + ${product.id}}" class="btn btn-danger btn-sm"
                           onclick="return confirm('Bạn chắc chắn muốn xoá?')">Xóa</a>
                    </td>
                </tr>
                </tbody>
            </table>

            <!-- PAGINATION -->
            <nav class="mt-4">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${productPage.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/products(page=${productPage.number - 1})}">Trước</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, productPage.totalPages - 1)}"
                        th:classappend="${i == productPage.number} ? 'active'">
                        <a class="page-link" th:href="@{/admin/products(page=${i})}" th:text="${i + 1}"></a>
                    </li>
                    <li class="page-item" th:classappend="${productPage.last} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/products(page=${productPage.number + 1})}">Sau</a>
                    </li>
                </ul>
            </nav>

        </div>
    </div>
</div>

<!-- TOAST -->
<div class="position-fixed top-0 end-0 p-3" style="z-index: 1100;">
    <div id="productToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body" id="productToastMessage"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<!-- POPUP CREATE -->
<div class="modal fade" id="createProductModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header" style="background-color: #f8f9fa;">
                <h5 class="modal-title">Thêm sản phẩm mới</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="createProductForm">
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Tên sản phẩm</label>
                            <input type="text" class="form-control" name="name" placeholder="Nhập tên sản phẩm" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Hãng sản xuất</label>
                            <input type="text" class="form-control" name="brand" placeholder="Ví dụ: Apple, Samsung" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Danh mục</label>
                            <select class="form-select" name="categoryId" required>
                                <option value="">-- Chọn danh mục --</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Giá</label>
                            <input type="number" class="form-control" name="price" placeholder="Nhập giá" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Tồn kho</label>
                            <input type="number" class="form-control" name="stock" placeholder="Nhập tồn kho" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">URL ảnh</label>
                            <input type="text" class="form-control" name="imageUrl" placeholder="Nhập link ảnh">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Mô tả</label>
                            <textarea class="form-control" name="description" rows="3" placeholder="Nhập mô tả"></textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="submit" class="btn btn-danger">Lưu sản phẩm</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- POPUP EDIT -->
<div class="modal fade" id="editProductModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header" style="background-color: #f8f9fa;">
                <h5 class="modal-title">Sửa sản phẩm</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="editProductForm">
                <div class="modal-body">
                    <input type="hidden" name="id" id="editProductId">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Tên sản phẩm</label>
                            <input type="text" class="form-control" name="name" id="editProductName" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Hãng sản xuất</label>
                            <input type="text" class="form-control" name="brand" id="editProductBrand" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Danh mục</label>
                            <select class="form-select" name="categoryId" id="editProductCategory" required>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Giá</label>
                            <input type="number" class="form-control" name="price" id="editProductPrice" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Tồn kho</label>
                            <input type="number" class="form-control" name="stock" id="editProductStock" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">URL ảnh</label>
                            <input type="text" class="form-control" name="imageUrl" id="editProductImage">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Mô tả</label>
                            <textarea class="form-control" name="description" id="editProductDescription" rows="3"></textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="submit" class="btn btn-warning">Cập nhật</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- FOOTER -->
<footer class="footer text-center p-3 mt-4">
    © 2026 Smartphone Store | Hotline: 0909 999 999 | Email: support@smartstore.vn
</footer>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {

        // EDIT BUTTON
        document.querySelectorAll('.edit-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.getElementById('editProductId').value = btn.dataset.id;
                document.getElementById('editProductName').value = btn.dataset.name;
                document.getElementById('editProductPrice').value = btn.dataset.price;
                document.getElementById('editProductBrand').value = btn.dataset.brand;
                document.getElementById('editProductStock').value = btn.dataset.stock;
                document.getElementById('editProductImage').value = btn.dataset.imageUrl;
                document.getElementById('editProductDescription').value = btn.dataset.description;
                document.getElementById('editProductCategory').value = btn.dataset.categoryId;
                new bootstrap.Modal(document.getElementById('editProductModal')).show();
            });
        });

        // SHOW TOAST
        function showToast(status, message) {
            const toastEl = document.getElementById('productToast');
            const toastMessage = document.getElementById('productToastMessage');
            toastMessage.textContent = message;
            toastEl.classList.remove('text-bg-success', 'text-bg-danger');
            toastEl.classList.add(status === 'success' ? 'text-bg-success' : 'text-bg-danger');
            new bootstrap.Toast(toastEl, { delay: 3000 }).show();
        }

        document.getElementById('createProductForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(this).entries());

            fetch('/admin/products/save', {
                method: 'POST',
                headers: {'Content-Type':'application/json','Accept':'application/json'},
                body: JSON.stringify(data)
            })
                .then(r => r.json())
                .then(res => {
                    showToast(res.status, res.message); // Hiện thông báo trước
                    if(res.status === 'success') {
                        setTimeout(() => { location.reload(); }, 1500); // Đợi 1.5s rồi mới load lại
                    }
                })
                .catch(err => showToast('error', 'Lỗi server!'));
        });

        // AJAX EDIT
        document.getElementById('editProductForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(this).entries());

            // Lưu ý: data.id phải tồn tại trong FormData (cái input hidden id ấy)
            fetch('/admin/products/update/' + data.id, {
                method: 'POST',
                headers: {'Content-Type':'application/json','Accept':'application/json'},
                body: JSON.stringify(data)
            })
                .then(r => r.json())
                .then(res => {
                    showToast(res.status, res.message);
                    if(res.status === 'success') {
                        setTimeout(() => { location.reload(); }, 1500); // Đợi để kịp nhìn thấy thông báo
                    }
                })
                .catch(err => showToast('error', 'Lỗi server!'));
        });

    });
</script>
</body>
</html>
