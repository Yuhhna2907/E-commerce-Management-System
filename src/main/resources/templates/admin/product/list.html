<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý sản phẩm</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        .header-red {
            background-color: #d70018;
        }
        .sidebar {
            min-height: 100vh;
            border-right: 1px solid #dee2e6;
        }
        .sidebar a {
            text-decoration: none;
            display: block;
            padding: 10px;
            color: #333;
            border-radius: 5px;
        }
        .sidebar a:hover {
            background-color: #f8f9fa;
            color: #d70018;
        }
        .footer {
            background: #212529;
            color: white;
        }
    </style>
</head>

<body>

<!-- ================= HEADER ================= -->
<nav class="navbar navbar-expand-lg header-red navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">SMARTPHONE STORE</a>
        <div class="text-white">
            Xin chào Admin
        </div>
    </div>
</nav>

<!-- ================= BODY ================= -->
<div class="container-fluid">
    <div class="row">

        <!-- SIDEBAR -->
        <div class="col-md-2 bg-white sidebar p-3">
            <h5>Danh mục</h5>
            <a href="#">📱 Điện thoại</a>
            <a href="#">💻 Laptop</a>
        </div>

        <!-- CONTENT -->
        <div class="col-md-10 p-4">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3>Danh sách sản phẩm</h3>
                <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#createProductModal">
                    + Thêm sản phẩm
                </a>
            </div>

            <!-- ================= SEARCH ================= -->
            <form class="d-flex mb-3" method="get" th:action="@{/admin/products}">
                <!-- Input tìm kiếm theo tên -->
                <input class="form-control me-2" type="search" name="keyword" placeholder="Tìm kiếm sản phẩm...">

                <!-- Select danh mục -->
                <select class="form-select me-2" name="categoryId" style="width: 200px;">
                    <option value="">-- Chọn danh mục --</option>
                    <option value="1">Điện thoại</option>
                    <option value="2">Laptop</option>
                    <!-- Thêm danh mục khác nếu cần -->
                </select>

                <!-- Nút tìm kiếm với icon kính lúp -->
                <button class="btn btn-outline-secondary" type="submit">
                    <i class="bi bi-search"></i>
                </button>
            </form>

            <table class="table table-bordered table-hover align-middle">
                <thead class="table-light">
                <tr class="text-center">
                    <th>ID</th>
                    <th>Tên</th>
                    <th class="text-center">
                        <a th:href="@{/admin/products(
        page=${productPage.number},
        keyword=${keyword},
        categoryId=${categoryId},
        sort='price',
        direction=${direction == 'asc' and sort=='price' ? 'desc' : 'asc'}
    )}" class="text-decoration-none text-dark">
                            Giá
                            <i class="bi"
                               th:classappend="${sort=='price'} ? (${direction=='asc'} ? 'bi-caret-up-fill' : 'bi-caret-down-fill') : ''"></i>
                        </a>
                    </th>
                    <th class="text-center">
                        <a th:href="@{/admin/products(
        page=${productPage.number},
        keyword=${keyword},
        categoryId=${categoryId},
        sort='stock',
        direction=${direction == 'asc' and sort=='stock' ? 'desc' : 'asc'}
    )}" class="text-decoration-none text-dark">
                            Tồn kho
                            <i class="bi"
                               th:classappend="${sort=='stock'} ? (${direction=='asc'} ? 'bi-caret-up-fill' : 'bi-caret-down-fill') : ''"></i>
                        </a>
                    </th>
                    <th>Danh mục</th>
                    <th>Trạng thái</th>
                    <th width="150">Thao tác</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="product : ${products}">
                    <td th:text="${product.id}" class="text-center"></td>
                    <td th:text="${product.name}"></td>
                    <td th:text="${product.price}"></td>
                    <td th:text="${product.stock}" class="text-center"></td>
                    <td th:text="${product.categoryName}"></td>
                    <td class="text-center">
                        <span class="badge bg-success" th:if="${product.active}">Hoạt động</span>
                        <span class="badge bg-secondary" th:unless="${product.active}">Đã ẩn</span>
                    </td>
                    <td class="text-center">
                        <a th:href="@{'/admin/products/edit/' + ${product.id}}" class="btn btn-warning btn-sm">Sửa</a>
                        <a th:href="@{'/admin/products/delete/' + ${product.id}}" class="btn btn-danger btn-sm"
                           onclick="return confirm('Bạn chắc chắn muốn xoá?')">Xóa</a>
                    </td>
                </tr>
                </tbody>
            </table>

            <!-- ================= PAGINATION ================= -->
            <nav class="mt-4">
                <ul class="pagination justify-content-center">

                    <!-- Previous -->
                    <li class="page-item"
                        th:classappend="${productPage.first} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/admin/products(
                    page=${productPage.number - 1},
                    keyword=${keyword},
                    categoryId=${categoryId}
               )}">
                            Trước
                        </a>
                    </li>

                    <!-- Page numbers -->
                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(0, productPage.totalPages - 1)}"
                        th:classappend="${i == productPage.number} ? 'active'">

                        <a class="page-link"
                           th:href="@{/admin/products(
                    page=${i},
                    keyword=${keyword},
                    categoryId=${categoryId}
               )}"
                           th:text="${i + 1}">
                        </a>
                    </li>

                    <!-- Next -->
                    <li class="page-item"
                        th:classappend="${productPage.last} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/admin/products(
                    page=${productPage.number + 1},
                    keyword=${keyword},
                    categoryId=${categoryId}
               )}">
                            Sau
                        </a>
                    </li>

                </ul>
            </nav>


            <!-- Page Info -->
            <div class="text-center small text-muted mt-2"
                 th:if="${productPage.totalElements > 0}">
                Hiển thị
                <span th:text="${productPage.number * productPage.size + 1}"></span>
                -
                <span th:text="${productPage.number * productPage.size + productPage.numberOfElements}"></span>
                trong tổng số
                <span th:text="${productPage.totalElements}"></span>
                sản phẩm
            </div>

        </div>
    </div>
</div>

<!-- ================= FOOTER ================= -->
<footer class="footer text-center p-3 mt-4">
    © 2026 Smartphone Store |
    Hotline: 0909 999 999 |
    Email: support@smartstore.vn
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
