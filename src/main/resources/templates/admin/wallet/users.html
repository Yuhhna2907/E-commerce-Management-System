<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách Ví User | SmartZone Enterprise</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --sz-orange: #fbbd05;
            --sz-dark: #1A1C20;
            --sz-text-muted: #8E8E93;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.45);
        }

        body {
            background-color: #f0f2f5;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(251, 189, 5, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 10%, rgba(59, 130, 246, 0.05) 0%, transparent 40%);
            background-attachment: fixed;
            font-family: 'Inter', sans-serif;
            color: var(--sz-dark);
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.03);
            padding: 24px;
        }

        .wallet-row {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 12px;
            border: 1px solid rgba(0,0,0,0.04);
            transition: all 0.25s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .wallet-row:hover {
            background: white;
            transform: scale(1.01);
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            border-color: var(--sz-orange);
        }

        .balance-badge {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--sz-dark);
        }

        .search-bar {
            background: white;
            border-radius: 14px;
            border: 1px solid rgba(0,0,0,0.08);
            padding: 12px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .search-bar:focus {
            box-shadow: 0 0 0 4px rgba(251, 189, 5, 0.15);
            border-color: var(--sz-orange);
            outline: none;
        }
    </style>
</head>
<body>

<div class="container-fluid py-4 px-4">
    <div class="row g-4">
        <div class="col-auto" style="width: 260px;">
             <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>
        </div>

        <div class="col">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="d-flex align-items-center gap-3">
                    <a th:href="@{/admin/wallet}" class="btn btn-light rounded-circle shadow-sm" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;">
                        <i class="bi bi-chevron-left"></i>
                    </a>
                    <div>
                        <h2 class="fw-bolder mb-0">👥 Quản lý Ví User</h2>
                        <p class="text-muted small">Kiểm soát số dư của tất cả khách hàng</p>
                    </div>
                </div>
            </div>

            <!-- Search -->
            <form th:action="@{/admin/wallet/users}" method="get" class="mb-4">
                <div class="input-group">
                    <input type="text" name="search" th:value="${search}" class="search-bar flex-grow-1" placeholder="Tìm theo tên hoặc email...">
                    <button type="submit" class="btn btn-dark rounded-end-pill px-4" style="margin-left: -50px; z-index: 10;">
                        <i class="bi bi-search"></i>
                    </button>
                </div>
            </form>

            <div class="glass-panel">
                <div th:if="${#lists.isEmpty(wallets)}" class="text-center py-5 opacity-50">
                    <i class="bi bi-person-x-fill display-4 mb-3 d-block"></i>
                    <p class="fw-bold">Không tìm thấy người dùng nào.</p>
                </div>

                <div th:each="w : ${wallets}">
                    <a th:href="@{/admin/wallet/users/{userId}(userId=${w.userId})}" class="wallet-row">
                        <div class="row align-items-center">
                            <div class="col-md-5">
                                <div class="d-flex align-items-center gap-3">
                                    <div class="avatar bg-gradient-orange text-white rounded-circle d-flex align-items-center justify-content-center fw-bold" 
                                         style="width: 48px; height: 48px; min-width: 48px; background: linear-gradient(135deg, #6e8efb, #a777e3);">
                                         <span th:text="${#strings.substring(w.username, 0, 1).toUpperCase()}">U</span>
                                    </div>
                                    <div>
                                        <div class="fw-bold" th:text="${w.username}">Username</div>
                                        <div class="small text-muted" th:text="${w.email}">email</div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="small text-muted mb-1 text-uppercase fw-bold" style="font-size: 0.65rem; letter-spacing: 0.5px;">Số dư hiện tại</div>
                                <div class="balance-badge" th:text="${#numbers.formatDecimal(w.balance, 0, 'COMMA', 0, 'POINT')} + '₫'">0₫</div>
                            </div>
                            <div class="col-md-3">
                                <div class="small text-muted mb-1 text-uppercase fw-bold" style="font-size: 0.65rem; letter-spacing: 0.5px;">Lần cuối cập nhật</div>
                                <div class="small fw-medium" th:text="${#temporals.format(w.updatedAt, 'dd/MM/yyyy HH:mm')}">--/--/----</div>
                            </div>
                            <div class="col-md-1 text-end">
                                <i class="bi bi-chevron-right text-muted"></i>
                            </div>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
