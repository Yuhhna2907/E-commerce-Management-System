<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm Khuyến mãi - Smartphone Store</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        .header-red {
            background-color: #d70018;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .sidebar { min-height: 100vh; border-right: 1px solid #dee2e6; }
        .sidebar a { text-decoration: none; display: block; padding: 10px; color: #333; border-radius: 5px; }
        .sidebar a:hover, .sidebar a.active { background-color: #f8f9fa; color: #d70018; font-weight: bold; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg header-red navbar-dark shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/admin/dashboard}">
            <i class="bi bi-phone"></i> SMARTPHONE STORE
        </a>
        <div class="text-white">Xin chào, <span class="fw-bold">Admin</span></div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 bg-white sidebar p-3 shadow-sm">
            <h6 class="text-muted text-uppercase fw-bold">Danh mục quản lý</h6>

            <a th:href="@{/admin/dashboard}" class="sidebar-link">
                <i class="bi bi-speedometer2 me-2"></i> Tổng quan
            </a>

            <a th:href="@{/admin/products}" class="sidebar-link">
                <i class="bi bi-box-seam me-2"></i> Sản phẩm
            </a>

            <a th:href="@{/admin/categories}" class="sidebar-link">
                <i class="bi bi-tags me-2"></i> Danh mục
            </a>

            <a th:href="@{/admin/orders}" class="sidebar-link">
                <i class="bi bi-cart-check me-2"></i> Đơn hàng
            </a>

            <a th:href="@{/admin/coupons}" class="sidebar-link active">
                <i class="bi bi-ticket-perforated me-2"></i> Khuyến mãi / Voucher
            </a>
            <hr>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold text-dark" th:text="${coupon.id == null ? 'Thêm Khuyến Mãi Mới' : 'Cập Nhật Khuyến Mãi'}">Thêm Khuyến Mãi Mới</h3>
                <a th:href="@{/admin/coupons}" class="btn btn-outline-secondary shadow-sm">
                    <i class="bi bi-arrow-left"></i> Quay lại
                </a>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <form th:action="@{/admin/coupons/save}" th:object="${coupon}" method="POST">
                        <input type="hidden" th:field="*{id}" />
                        <div class="row g-4">
                            
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Mã Code <span class="text-danger">*</span></label>
                                <input type="text" class="form-control text-uppercase fw-bold text-danger" th:field="*{code}" required placeholder="VD: MEGA100">
                            </div>
                            
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Loại cấu trúc giảm <span class="text-danger">*</span></label>
                                <select class="form-select" th:field="*{discountType}" required>
                                    <option value="PERCENTAGE">Giảm theo %</option>
                                    <option value="FIXED_AMOUNT">Trừ thẳng tiền mặt (VNĐ)</option>
                                </select>
                            </div>
                            
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Giá trị giảm <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" th:field="*{discountValue}" required min="1">
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Giảm Tối Đa (VNĐ) <span class="text-muted small fw-normal">(Tuỳ chọn nếu nhập %)</span></label>
                                <input type="number" class="form-control" th:field="*{maxDiscountAmount}">
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Giá trị đơn tối thiểu (VNĐ)</label>
                                <input type="number" class="form-control" th:field="*{minOrderValue}" value="0">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold">Tổng lượt sử dụng giới hạn</label>
                                <input type="number" class="form-control" th:field="*{maxUsageGlobal}" placeholder="100, để trống là không giới hạn">
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Giới hạn số lần dùng/1 User</label>
                                <input type="number" class="form-control" th:field="*{perUserLimit}" placeholder="VD: 1, 2">
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Thời gian Bắt đầu <span class="text-danger">*</span></label>
                                <input type="datetime-local" class="form-control" th:field="*{startDate}" required>
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Thời gian Kết thúc <span class="text-danger">*</span></label>
                                <input type="datetime-local" class="form-control" th:field="*{endDate}" required>
                            </div>
                            
                            <div class="col-12">
                                <label class="form-label fw-bold">Mô tả mã (Dành cho nội bộ hoặc thể hiện ngoài Widget)</label>
                                <textarea class="form-control" th:field="*{description}" rows="3"></textarea>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-bold">
                                    Áp dụng cho sản phẩm
                                    <span class="text-muted small fw-normal">(Để trống = áp dụng toàn bộ sản phẩm)</span>
                                </label>
                                <select class="form-select" th:field="*{applicableProductIds}" multiple size="8">
                                    <option th:each="p : ${allProducts}"
                                            th:value="${p.id}"
                                            th:text="${p.name + ' (' + #numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT') + ' ₫)'}">
                                    </option>
                                </select>
                                <div class="form-text">
                                    Giữ Ctrl (Windows) hoặc Cmd (Mac) để chọn nhiều sản phẩm.
                                </div>
                            </div>
                        </div>

                        <div class="mt-4 text-end">
                            <button type="submit" class="btn btn-danger px-5 py-2 fw-bold" th:text="${coupon.id == null ? 'TẠO MÃ KHUYẾN MÃI' : 'LƯU THAY ĐỔI'}"><i class="bi bi-save"></i> TẠO MÃ KHUYẾN MÃI</button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
