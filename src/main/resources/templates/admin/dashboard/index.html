<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tổng quan hệ thống - SmartZone Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/admin-common.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<nav class="navbar navbar-expand-lg header-sz">
    <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center fw-bold text-dark" th:href="@{/admin/dashboard}">
            <div class="bg-warning rounded-3 p-2 me-3 d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                <i class="bi bi-phone-fill text-white"></i>
            </div>
            SmartZone <span class="text-warning ms-2" style="font-weight: 700;">Admin</span>
        </a>
        <div class="ms-auto d-flex align-items-center gap-4">
            <div class="user-greeting">
                Xin chào, <span class="username" th:text="${#authentication.principal.username ?: 'Admin'}"></span>
            </div>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-sm" style="background-color: var(--sz-orange); color: white; font-weight: 600; border-radius: 8px; transition: all 0.2s;" onmouseover="this.style.opacity='0.85'" onmouseout="this.style.opacity='1'" onclick="return confirm('Bạn có chắc muốn đăng xuất?')">
                    <i class="bi bi-box-arrow-right me-2"></i> Đăng xuất
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="main-wrapper">
    <!-- Sidebar -->
    <div class="sidebar-container">
        <p class="sidebar-title">Quản lý</p>
        <a th:href="@{/admin/dashboard}" class="sidebar-link active">
            <i class="bi bi-grid-1x2-fill"></i>
            <span>Tổng quan</span>
        </a>
        <a th:href="@{/admin/products}" class="sidebar-link">
            <i class="bi bi-phone-vibrate-fill"></i>
            <span>Sản phẩm</span>
        </a>
        <a th:href="@{/admin/categories}" class="sidebar-link">
            <i class="bi bi-stack"></i>
            <span>Danh mục</span>
        </a>
        <a th:href="@{/admin/orders}" class="sidebar-link">
            <i class="bi bi-cart-check-fill"></i>
            <span>Đơn hàng</span>
        </a>
        <a th:href="@{/admin/coupons}" class="sidebar-link">
            <i class="bi bi-ticket-perforated-fill"></i>
            <span>Khuyến mãi</span>
        </a>
        <hr class="sidebar-divider">
        <form th:action="@{/logout}" method="post" class="d-block">
            <button type="submit" class="sidebar-link btn-logout btn" onclick="return confirm('Bạn có chắc muốn đăng xuất?')">
                <i class="bi bi-box-arrow-right"></i>
                <span>Đăng xuất</span>
            </button>
        </form>
    </div>

    <!-- Content Area -->
    <div class="content-area">
        <div class="page-header">
            <h2>Báo cáo hệ thống</h2>
            <p>Phân tích doanh thu và vận đơn thời gian thực</p>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="card-stat bg-gradient-green">
                <div class="stat-label">Doanh thu thực</div>
                <div class="stat-value" th:text="${#numbers.formatDecimal(stats.actualRevenue, 0, 'COMMA', 0, 'POINT') + ' ₫'}"></div>
                <i class="bi bi-cash-stack"></i>
            </div>
            <div class="card-stat bg-gradient-blue">
                <div class="stat-label">Doanh thu giả định</div>
                <div class="stat-value" th:text="${#numbers.formatDecimal(stats.totalRevenue, 0, 'COMMA', 0, 'POINT') + ' ₫'}"></div>
                <i class="bi bi-calculator"></i>
            </div>
            <div class="card-stat bg-gradient-cyan">
                <div class="stat-label">Đang giao</div>
                <div class="stat-value" th:text="${stats.shippingOrders}"></div>
                <i class="bi bi-truck"></i>
            </div>
            <div class="card-stat bg-gradient-purple">
                <div class="stat-label">Sản phẩm</div>
                <div class="stat-value" th:text="${stats.totalProducts}"></div>
                <i class="bi bi-box-seam"></i>
            </div>
            <div class="card-stat bg-gradient-orange">
                <div class="stat-label">Sắp hết hàng</div>
                <div class="stat-value" th:text="${stats.lowStockCount}"></div>
                <i class="bi bi-exclamation-triangle"></i>
            </div>
        </div>

        <!-- Charts Section -->
        <div class="row g-4">
            <div class="col-lg-8">
                <div class="chart-card">
                    <div class="d-flex justify-content-between align-items-center">
                        <h6>Doanh thu 7 ngày (Thực tế vs Giả định)</h6>
                        <div class="chart-legend">
                            <span><i class="bi bi-circle-fill" style="color: #198754; font-size: 0.6rem;"></i> Thực tế</span>
                            <span><i class="bi bi-circle-fill" style="color: var(--sz-orange); font-size: 0.6rem;"></i> Giả định</span>
                        </div>
                    </div>
                    <div class="chart-container">
                        <canvas id="revenueChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="chart-card">
                    <h6>Top 5 sản phẩm bán chạy</h6>
                    <div class="chart-container">
                        <canvas id="topProductsChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const revenueLabels = /*[[${stats.revenueLabels}]]*/ [];
    const actualValues = /*[[${stats.actualRevenueValues}]]*/ [];
    const assumedValues = /*[[${stats.assumedRevenueValues}]]*/ [];
    const topProductNames = /*[[${stats.topProductNames}]]*/ [];
    const topProductSales = /*[[${stats.topProductSales}]]*/ [];

    Chart.defaults.font.family = "'Inter', sans-serif";
    Chart.defaults.color = "#6e6e73";

    // 1. Line Chart So sánh doanh thu
    const ctxRevenue = document.getElementById('revenueChart');
    if (ctxRevenue) {
        new Chart(ctxRevenue, {
            type: 'line',
            data: {
                labels: revenueLabels,
                datasets: [
                    {
                        label: 'Doanh thu thực tế',
                        data: actualValues,
                        borderColor: '#198754',
                        backgroundColor: 'rgba(25, 135, 84, 0.05)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 4
                    },
                    {
                        label: 'Doanh thu giả định',
                        data: assumedValues,
                        borderColor: '#fbbd05',
                        borderWidth: 2,
                        borderDash: [5, 5],
                        fill: false,
                        tension: 0.4,
                        pointRadius: 0 // Giấu điểm để tập trung vào đường thực tế
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        mode: 'index',
                        intersect: false,
                        padding: 12,
                        callbacks: {
                            label: function(context) {
                                return ' ' + context.dataset.label + ': ' + context.parsed.y.toLocaleString('vi-VN') + ' ₫';
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: { callback: v => v.toLocaleString('vi-VN') + ' ₫' }
                    },
                    x: { grid: { display: false } }
                }
            }
        });
    }

    // 2. Doughnut Chart Top sản phẩm
    const ctxDoughnut = document.getElementById('topProductsChart');
    if (ctxDoughnut) {
        const hasData = topProductSales && topProductSales.length > 0 && topProductSales.some(v => v > 0);
        new Chart(ctxDoughnut, {
            type: 'doughnut',
            data: {
                labels: hasData ? topProductNames : ['Chưa có dữ liệu'],
                datasets: [{
                    data: hasData ? topProductSales : [1],
                    backgroundColor: hasData
                        ? ['#fbbd05', '#1d1d1f', '#6f42c1', '#0d6efd', '#198754']
                        : ['#e5e5e5'],
                    borderWidth: 2,
                    borderColor: '#ffffff'
                }]
            },
            options: {
                cutout: '70%',
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: hasData,
                        position: 'bottom',
                        labels: { usePointStyle: true, padding: 20 }
                    }
                }
            }
        });
    }
    /*]]>*/
</script>

</body>
</html>
