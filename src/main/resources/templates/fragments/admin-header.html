<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <!-- Admin Header Fragment -->
    <th:block th:fragment="admin-header">
        <nav class="navbar navbar-expand-lg bg-white border-bottom py-3">
            <div class="container-fluid px-4">
                <a class="navbar-brand d-flex align-items-center fw-bold text-dark" th:href="@{/admin/dashboard}">
                    <div class="bg-warning rounded-3 p-2 me-2 d-flex align-items-center justify-content-center" style="width: 35px; height: 35px;">
                        <i class="bi bi-phone-fill text-white"></i>
                    </div>
                    SmartZone <span class="text-warning ms-1">Admin</span>
                </a>
                <div class="ms-auto d-flex align-items-center gap-3">
                    <div class="text-dark fw-bold">Xin chào, <span class="text-warning" th:text="${#authentication.principal.username ?: 'Admin'}"></span></div>
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-sm btn-outline-danger fw-bold" onclick="return confirm('Bạn có chắc muốn đăng xuất?')">
                            <i class="bi bi-box-arrow-right me-1"></i> Đăng xuất
                        </button>
                    </form>
                </div>
            </div>
        </nav>
    </th:block>

    <!-- Admin Sidebar Fragment -->
    <th:block th:fragment="admin-sidebar">
        <div class="sidebar-container p-3">
            <p class="text-muted small fw-bold px-3 mb-3 text-uppercase" style="font-size: 0.7rem; letter-spacing: 1px;">Quản lý</p>
            <a th:href="@{/admin/dashboard}" class="sidebar-link mb-2" th:classappend="${#request.requestURI == '/admin/dashboard' ? 'active' : ''}">
                <i class="bi bi-grid-1x2-fill me-3"></i> Tổng quan
            </a>
            <a th:href="@{/admin/products}" class="sidebar-link mb-2" th:classappend="${#request.requestURI.contains('/admin/products') ? 'active' : ''}">
                <i class="bi bi-phone-vibrate-fill me-3"></i> Sản phẩm
            </a>
            <a th:href="@{/admin/categories}" class="sidebar-link mb-2" th:classappend="${#request.requestURI.contains('/admin/categories') ? 'active' : ''}">
                <i class="bi bi-stack me-3"></i> Danh mục
            </a>
            <a th:href="@{/admin/orders}" class="sidebar-link mb-2" th:classappend="${#request.requestURI.contains('/admin/orders') ? 'active' : ''}">
                <i class="bi bi-cart-check-fill me-3"></i> Đơn hàng
            </a>
            <a th:href="@{/admin/coupons}" class="sidebar-link mb-2" th:classappend="${#request.requestURI.contains('/admin/coupons') ? 'active' : ''}">
                <i class="bi bi-ticket-perforated-fill me-3"></i> Khuyến mãi
            </a>
            <hr class="my-4 opacity-25">
            <form th:action="@{/logout}" method="post" class="d-block">
                <button type="submit" class="sidebar-link text-danger w-100 text-start border-0 bg-transparent" onclick="return confirm('Bạn có chắc muốn đăng xuất?')">
                    <i class="bi bi-box-arrow-right me-3"></i> Đăng xuất
                </button>
            </form>
        </div>
    </th:block>
</body>
</html>
