<!-- Magic Script for Navbar shrink & Search logic -->
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const header = document.getElementById("mainNavbar");
        
        // Sticky Shrink Effect
        window.addEventListener("scroll", () => {
            if (window.scrollY > 40) {
                header.classList.add("header-scrolled");
            } else {
                header.classList.remove("header-scrolled");
            }
        });
        
        // Cần đảm bảo việc click vào input không đóng capsule ngay
        const searchInput = document.getElementById('hInput');
        if(searchInput) {
            searchInput.addEventListener('click', function(e) {
                e.stopPropagation();
            });
        }

        document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(function (el) {
            new bootstrap.Tooltip(el);
        });

        // Tự động xổ ví Voucher khi load nghiệm (nếu muốn pop-up)
        setTimeout(() => {
            document.getElementById('floatingWalletBtn')?.classList.add('pulse-strong');
        }, 3000);
    });

    function toggleWalletPopup() {
        // Disabled popup logic in favor of dedicated page navigation
    }
</script>

<script>
    // Animation Flying Ticket into Wallet
    function flyToWallet(event, formElement) {
        event.preventDefault();
        
        const btn = formElement.querySelector('button');
        const walletIcon = document.getElementById('floatingWalletBtn');
        if (!btn || !walletIcon) {
            formElement.submit();
            return;
        }

        // Tạo cục clone
        const rect = btn.getBoundingClientRect();
        const clone = document.createElement('div');
        clone.innerHTML = '<i class="bi bi-ticket-detailed-fill text-warning fs-3 drop-shadow"></i>';
        clone.style.position = 'fixed';
        clone.style.top = rect.top + 'px';
        clone.style.left = rect.left + 'px';
        clone.style.zIndex = '9999';
        clone.style.transition = 'all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
        clone.style.transform = 'scale(1)';
        document.body.appendChild(clone);

        // Kỹ thuật reflow
        void clone.offsetWidth;

        // Điểm đến
        const targetRect = walletIcon.getBoundingClientRect();
        clone.style.top = (targetRect.top + 10) + 'px';
        clone.style.left = (targetRect.left + 10) + 'px';
        clone.style.transform = 'scale(0.2) rotate(360deg)';
        clone.style.opacity = '0';

        setTimeout(() => {
            clone.remove();
            walletIcon.classList.add('pulse-strong');
            setTimeout(() => {
                formElement.submit(); // Submit form sau khi animation xong
            }, 300);
        }, 800);
    }
</script>

            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: color 0.3s;
        }
        
        .stepper-step.active .stepper-label,
        .stepper-step.completed .stepper-label {
            color: #0f172a;
        }

        /* Responsive Progress Bar Math */
        .w-cart .stepper-progress-fill { width: 33.33%; }
        .w-checkout .stepper-progress-fill { width: 66.66%; }
        .w-success .stepper-progress-fill { width: 100%; }
    </style>

    <div class="stepper-progress-bg"></div>
    <div class="stepper-progress-fill" th:classappend="'w-' + ${activeStep}"></div>

    <div class="d-flex justify-content-between position-relative">
        <!-- Step 1 -->
        <div class="stepper-step completed">
            <div class="stepper-icon"><i class="bi bi-phone"></i></div>
            <div class="stepper-label d-none d-sm-block">Chọn SP</div>
        </div>
        
        <!-- Step 2 -->
        <div class="stepper-step" th:classappend="${activeStep == 'cart' ? 'active' : (activeStep == 'checkout' or activeStep == 'success' ? 'completed' : '')}">
            <div class="stepper-icon"><i class="bi bi-cart3"></i></div>
            <div class="stepper-label d-none d-sm-block">Giỏ hàng</div>
        </div>
        
        <!-- Step 3 -->
        <div class="stepper-step" th:classappend="${activeStep == 'checkout' ? 'active' : (activeStep == 'success' ? 'completed' : '')}">
            <div class="stepper-icon"><i class="bi bi-credit-card"></i></div>
            <div class="stepper-label d-none d-sm-block">Thanh toán</div>
        </div>
        
        <!-- Step 4 -->
        <div class="stepper-step" th:classappend="${activeStep == 'success' ? 'active completed' : ''}">
            <div class="stepper-icon"><i class="bi bi-check2-circle"></i></div>
            <div class="stepper-label d-none d-sm-block">Hoàn tất</div>
        </div>
    </div>
</div>
