<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - SmartZone</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/auth-forms.css}" rel="stylesheet">
</head>
<body>

<div class="card auth-card">
    <!-- Icon -->
    <div class="auth-icon">
        <i class="bi bi-envelope"></i>
    </div>

    <!-- Title -->
    <div class="text-center">
        <h2 class="page-title">Quên mật khẩu?</h2>
        <p class="page-subtitle">Nhập email đăng ký để nhận link đặt lại mật khẩu</p>
    </div>

    <!-- Success Message -->
    <div th:if="${message}" class="alert alert-success text-center">
        <i class="bi bi-check-circle me-1"></i>
        <span th:text="${message}"></span>
    </div>

    <!-- Error Message -->
    <div th:if="${error}" class="alert alert-danger text-center">
        <i class="bi bi-exclamation-triangle me-1"></i>
        <span th:text="${error}"></span>
    </div>

    <!-- Forgot Password Form -->
    <form th:action="@{/forgot-password}" method="post" id="forgotPasswordForm">
        <!-- Email Input -->
        <div class="mb-4">
            <label for="email" class="form-label">Email đăng ký</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" 
                       id="email"
                       name="email" 
                       class="form-control" 
                       placeholder="email@example.com" 
                       required
                       autocomplete="email">
            </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary w-100" id="submitBtn">
            <span id="btnText">
                <i class="bi bi-send me-2"></i>
                Gửi link reset mật khẩu
            </span>
            <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status" aria-hidden="true"></span>
        </button>
    </form>

    <!-- Back to Login Link -->
    <div class="text-center mt-4">
        <a th:href="@{/login}" class="small">
            <i class="bi bi-arrow-left me-1"></i>
            Quay lại đăng nhập
        </a>
    </div>
</div>

<script>
// Form submission with loading state
document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    
    // Show loading state
    submitBtn.disabled = true;
    btnText.innerHTML = '<i class="bi bi-hourglass-split me-2"></i>Đang xử lý...';
    btnSpinner.classList.remove('d-none');
});
</script>

</body>
</html>
