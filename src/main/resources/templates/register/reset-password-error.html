<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lỗi đặt lại mật khẩu - SmartZone</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/auth-forms.css}" rel="stylesheet">
</head>
<body>

<div class="card auth-card">
    <!-- Icon -->
    <div class="auth-icon" style="background: linear-gradient(135deg, #dc3545, #ef4444);">
        <i class="bi bi-exclamation-triangle"></i>
    </div>

    <!-- Title -->
    <div class="text-center">
        <h2 class="page-title">Link không hợp lệ</h2>
        <p class="page-subtitle">Link đặt lại mật khẩu không hợp lệ hoặc đã hết hạn</p>
    </div>

    <!-- Error Message -->
    <div class="alert alert-danger text-center">
        <i class="bi bi-exclamation-triangle me-1"></i>
        <span th:text="${error ?: 'Link reset mật khẩu không hợp lệ hoặc đã hết hạn'}"></span>
    </div>

    <!-- Information Box -->
    <div class="alert alert-info text-center">
        <i class="bi bi-info-circle me-1"></i>
        <span>Link reset mật khẩu chỉ có hiệu lực trong 1 giờ và chỉ có thể sử dụng một lần.</span>
    </div>

    <!-- Action Buttons -->
    <div class="d-grid gap-3 mb-4">
        <!-- Request New Reset Link -->
        <a th:href="@{/forgot-password}" class="btn btn-primary">
            <i class="bi bi-envelope me-2"></i>
            Yêu cầu link reset mới
        </a>
        
        <!-- Back to Login -->
        <a th:href="@{/login}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-2"></i>
            Quay lại đăng nhập
        </a>
    </div>

    <!-- Help Text -->
    <div class="text-center">
        <p class="small text-muted mb-2">
            <i class="bi bi-question-circle me-1"></i>
            Cần trợ giúp?
        </p>
        <p class="small text-muted">
            Nếu bạn gặp vấn đề, vui lòng liên hệ với chúng tôi qua email 
            <a href="mailto:support@smartzone.com">support@smartzone.com</a>
        </p>
    </div>
</div>

<style>
/* Additional styles for outline button */
.btn-outline-secondary {
    border: 2px solid rgba(0,0,0,0.1);
    background: rgba(255,255,255,0.5);
    color: var(--text-main);
    border-radius: var(--radius-md);
    padding: 14px 24px;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.btn-outline-secondary:hover {
    background: rgba(255,255,255,0.9);
    border-color: rgba(0,0,0,0.2);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px -6px rgba(0,0,0,0.15);
    color: var(--text-main);
    text-decoration: none;
}

.btn-outline-secondary:active {
    transform: translateY(0);
}
</style>

</body>
</html>
