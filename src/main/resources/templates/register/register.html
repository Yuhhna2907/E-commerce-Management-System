<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký tài khoản - SmartZone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f5f5f7; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px 0; }
        .register-card { width: 100%; max-width: 450px; padding: 30px; border-radius: 20px; border: none; }
        .btn-warning { color: white; font-weight: bold; border-radius: 10px; }
    </style>
</head>
<body>

<div class="card register-card shadow-sm">
    <div class="text-center mb-4">
        <h2 class="fw-bold">SmartZone <span class="text-warning">Register</span></h2>
        <p class="text-muted small">Tạo tài khoản mới để trải nghiệm</p>
    </div>

    <div th:if="${error}" class="alert alert-danger py-2 small text-center">
        <span th:text="${error}"></span>
    </div>

    <form th:action="@{/register}" th:object="${user}" method="post">
        <div class="row">
            <div class="col-md-12 mb-3">
                <label class="form-label small fw-bold">Họ và tên</label>
                <input type="text" th:field="*{fullName}" class="form-control shadow-none" placeholder="Nguyễn Văn A" required>
            </div>
            <div class="col-md-12 mb-3">
                <label class="form-label small fw-bold">Tên đăng nhập</label>
                <input type="text" th:field="*{username}" class="form-control shadow-none" placeholder="vuduy2003" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label small fw-bold">Email</label>
                <input type="email" th:field="*{email}" class="form-control shadow-none" placeholder="duy@gmail.com">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label small fw-bold">Số điện thoại</label>
                <input type="text" th:field="*{phone}" class="form-control shadow-none" placeholder="0987654321">
            </div>
            <div class="col-md-12 mb-3">
                <label class="form-label small fw-bold">Mật khẩu</label>
                <input type="password" th:field="*{password}" class="form-control shadow-none" placeholder="Tối thiểu 6 ký tự" required>
            </div>
        </div>

        <button type="submit" class="btn btn-warning w-100 py-2 mt-2 shadow-sm">Tạo tài khoản</button>
    </form>

    <div class="text-center mt-4">
        <p class="small text-muted">Đã có tài khoản? <a th:href="@{/login}" class="text-warning text-decoration-none fw-bold">Đăng nhập</a></p>
    </div>
</div>

</body>
</html>
