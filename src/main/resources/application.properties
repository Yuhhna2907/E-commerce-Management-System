spring.application.name=smartphone-management

# DATABASE
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/smart_phone
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# DATABASE SCHEMA MANAGEMENT
# Using Hibernate auto-DDL instead of Flyway for development

# LOG SQL
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

spring.profiles.active=local


# STATIC RESOURCES - Serve images, CSS, JS
spring.web.resources.static-locations=classpath:/static/,file:uploads/
spring.mvc.static-path-pattern=/**
spring.web.resources.add-mappings=true

# FILE UPLOAD CONFIGURATION
# Gi?i h?n kích th??c file upload (m?c ??nh ch? 1MB, t?ng lên 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB

# IMAGE PROCESSING CONFIGURATION
app.image.upload-dir=uploads/review-images
app.image.thumbnail-dir=uploads/review-images/thumbnails
app.image.max-file-size=5242880
app.image.max-images-per-review=5

# Image dimension constraints
app.image.min-width=100
app.image.min-height=100
app.image.max-width=4096
app.image.max-height=4096

# Thumbnail settings
app.image.thumbnail-width=300
app.image.thumbnail-height=300
app.image.thumbnail-quality=0.8

# Compression settings
app.image.compression-quality=0.85
app.image.max-compressed-width=1920
app.image.max-compressed-height=1920

# Rate limiting
app.image.max-uploads-per-minute=10
app.image.max-uploads-per-hour=50

# Legacy support (will be removed)
app.upload.review-images-dir=uploads/review-images
app.upload.max-file-size=5242880

# EMAIL CONFIGURATION (SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=luonganhhuy2004@gmail.com
spring.mail.password=wyisvpushfxyhkyj
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# APPLICATION BASE URL (for email links)
app.base-url=${APP_BASE_URL:http://localhost:8080}

# EMAIL RETRY CONFIGURATION
app.email.retry.max-attempts=3
app.email.retry.initial-delay=1000
app.email.retry.multiplier=2.0
app.email.retry.max-delay=10000

# PAYMENT RETRY CONFIGURATION
app.payment.retry.max-attempts=3
app.payment.retry.initial-delay=1000
app.payment.retry.multiplier=2.0
app.payment.retry.max-delay=10000

# VNPAY API CONFIGURATION
vnpay.apiUrl=https://sandbox-paymentv2.vnpay.vn
vnpay.refundUrl=${vnpay.apiUrl}

# WEBHOOK CONFIGURATION
app.payment.webhook.async-pool-size=10
app.payment.webhook.timeout=30000
app.payment.webhook.ip-whitelist=

# REFUND CONFIGURATION
app.payment.refund.timeout=30000
app.payment.refund.max-amount-check=true
app.payment.refund.audit-logging=true

# MONITORING AND METRICS CONFIGURATION
app.payment.metrics.enabled=true
app.payment.metrics.transaction-logging=true
app.payment.metrics.retry-tracking=true
app.payment.metrics.webhook-tracking=true
app.payment.metrics.refund-tracking=true

# SECURITY CONFIGURATION
app.payment.security.signature-validation=true
app.payment.security.ip-whitelist-enabled=false
app.payment.security.audit-logging=true

# CACHING CONFIGURATION
spring.cache.type=simple
spring.cache.cache-names=productRecommendations,coPurchasePatterns
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=24h

# ASYNC EXECUTION CONFIGURATION
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=async-task-

# SCHEDULING CONFIGURATION
spring.task.scheduling.pool.size=5
spring.task.scheduling.thread-name-prefix=scheduled-task-
app.scheduling.recommendation-rebuild-cron=0 0 2 * * ?

# DEVTOOLS CONFIGURATION - Auto reload khi sá»­a code
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.additional-paths=src/main/java,src/main/resources
spring.thymeleaf.cache=false

