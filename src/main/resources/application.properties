spring.application.name=smartphone-management

# DATABASE
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/smart_phone
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# LOG SQL
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# STATIC RESOURCES - Serve images, CSS, JS
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**
spring.web.resources.add-mappings=true

# FILE UPLOAD CONFIGURATION
# Gi?i h?n kích th??c file upload (m?c ??nh ch? 1MB, t?ng lên 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Tomcat max HTTP form post size (cho form data encoding)
server.tomcat.max-http-form-post-size=10485760
